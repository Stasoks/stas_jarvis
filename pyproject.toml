[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stas-jarvis"
version = "0.5.0"
description = "Local-first always-listening desktop agent for Linux"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "textual>=0.80",
    "rich>=13.7",
    "sounddevice>=0.4.7",
    "numpy>=1.24,<3",
    "vosk>=0.3.45",
    "faster-whisper>=1.0.3",
    "rapidfuzz>=3.6",
    "playwright>=1.48",
    "piper-tts>=1.3",
    "webrtcvad-wheels>=2.0.14",
    "Pillow>=10.0"
]

[project.scripts]
stas-jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]
